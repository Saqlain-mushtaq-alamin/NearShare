name: nearshare
description: "Your files never leave your Wi-Fi. No account. No ads. No cloud."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0

  # Database
  drift: ^2.16.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking (HTTP / P2P)
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  dio: ^5.4.3

  # Discovery
  bonsoir: ^6.0.1

  # Utilities
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  shelf_multipart: ^2.0.1
  collection: ^1.18.0
  crypto: ^3.0.8
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.4
  basic_utils: ^5.8.2
  local_auth: ^2.3.0
  sqlcipher_flutter_libs: ^0.6.8
  flutter_localizations:
    sdk: flutter
  disk_space_plus: ^0.2.6
  sqlite3: ^2.9.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.16.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  flutter_native_splash: ^2.4.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.png
